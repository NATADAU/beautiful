<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ты не один</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      min-height: 100vh;
      background: #fdf6f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }

    /* Тихий фоновый свет */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.22;
      pointer-events: none;
    }
    .glow-1 { width: 500px; height: 500px; background: #f7c9a8; top: -150px; left: -150px; animation: drift 14s ease-in-out infinite; }
    .glow-2 { width: 400px; height: 400px; background: #c8dff7; bottom: -100px; right: -100px; animation: drift 18s ease-in-out infinite reverse; }
    .glow-3 { width: 300px; height: 300px; background: #f7c8d4; top: 40%; left: 30%; animation: drift 20s ease-in-out infinite 4s; }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(20px, -25px); }
    }

    /* Контент */
    .wrap {
      position: relative;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .candle {
      font-size: 2.8rem;
      display: inline-block;
      animation: flicker 3s ease-in-out infinite;
      margin-bottom: 1.8rem;
    }
    @keyframes flicker {
      0%, 100% { transform: scale(1) rotate(-1deg); opacity: 1; }
      50%       { transform: scale(1.06) rotate(1deg); opacity: 0.88; }
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: normal;
      color: #5a4a42;
      line-height: 1.5;
      margin-bottom: 0.8rem;
    }

    .sub {
      font-size: 1rem;
      color: #a08c82;
      margin-bottom: 3rem;
      line-height: 1.7;
    }

    /* Карточка с фразой */
    .phrase-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 2.4rem 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 40px rgba(180, 140, 120, 0.12);
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .phrase-text {
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      color: #5a4a42;
      line-height: 1.7;
      font-style: italic;
    }

    .phrase-card.fade-out {
      opacity: 0;
      transform: translateY(-8px);
    }
    .phrase-card.fade-in {
      animation: fadeIn 0.6s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Кнопка */
    .btn {
      display: inline-block;
      padding: 0.9rem 2.4rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #f5cba7, #f7b8c8);
      color: #5a3a30;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(245, 180, 150, 0.35);
      letter-spacing: 0.3px;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(245, 180, 150, 0.5);
    }
    .btn:active { transform: scale(0.97); }

    /* Счётчик */
    .counter {
      margin-top: 1.4rem;
      font-size: 0.85rem;
      color: #c4a898;
      letter-spacing: 1px;
    }

    .heart {
      display: inline-block;
      animation: heartbeat 2.4s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      30%       { transform: scale(1.18); }
      60%       { transform: scale(1.06); }
    }
  </style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<div class="wrap">
  <div class="candle">🕯️</div>

  <h1>Сейчас трудно.<br>Это правда.</h1>
  <p class="sub">Нажимай, когда нужно что-то тёплое.</p>

  <div class="phrase-card fade-in" id="card">
    <p class="phrase-text" id="phrase">Ты справляешься лучше, чем тебе кажется.</p>
  </div>

  <button class="btn" id="btn" onclick="nextPhrase()">Ещё одно слово для тебя</button>

  <p class="counter"><span class="heart">♡</span> <span id="count">1</span> / 12</p>
</div>

<script>
  const phrases = [
    "Ты справляешься лучше, чем тебе кажется.",
    "Можно просто дышать. Этого уже достаточно.",
    "Твои чувства настоящие — и ты имеешь право их чувствовать.",
    "Ты не один, даже если сейчас так ощущается.",
    "После самой тёмной ночи всё равно приходит утро.",
    "Маленький шаг вперёд — это всё равно шаг.",
    "Тебе не нужно быть сильным прямо сейчас. Можно просто быть.",
    "Ты важен. Не за что-то — просто так.",
    "Всё это временно. А ты — нет.",
    "Разрешено отдыхать. Разрешено не знать ответов.",
    "Кто-то думает о тебе тепло прямо в эту минуту.",
    "Ты дошёл до сегодня. Это что-то значит."
  ];

  let current = 0;

  function nextPhrase() {
    const card = document.getElementById('card');
    const phraseEl = document.getElementById('phrase');
    const countEl = document.getElementById('count');

    card.classList.remove('fade-in');
    card.classList.add('fade-out');

    setTimeout(() => {
      current = (current + 1) % phrases.length;
      phraseEl.textContent = phrases[current];
      countEl.textContent = current + 1;

      card.classList.remove('fade-out');
      card.classList.add('fade-in');

      void card.offsetWidth; // reflow
    }, 400);
  }
</script>

</body>
</html>
