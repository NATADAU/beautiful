<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ты не один</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      min-height: 100vh;
      background: #fdf6f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }

    canvas#confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { width: 500px; height: 500px; background: #f7c9a8; top: -150px; left: -150px; animation: drift 14s ease-in-out infinite; }
    .glow-2 { width: 400px; height: 400px; background: #c8dff7; bottom: -100px; right: -100px; animation: drift 18s ease-in-out infinite reverse; }
    .glow-3 { width: 300px; height: 300px; background: #f7c8d4; top: 40%; left: 30%; animation: drift 20s ease-in-out infinite 4s; }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(20px, -25px); }
    }

    /* Воздушные шарики */
    .balloon {
      position: fixed;
      bottom: -140px;
      pointer-events: none;
      z-index: 2;
      animation: rise linear forwards;
    }
    @keyframes rise {
      0%   { transform: translateY(0)      rotate(-4deg); opacity: 0.95; }
      40%  { transform: translateY(-45vh)  rotate(4deg); }
      80%  { transform: translateY(-85vh)  rotate(-3deg); opacity: 0.8; }
      100% { transform: translateY(-115vh) rotate(2deg);  opacity: 0; }
    }

    /* Кнопка музыки */
    .music-btn {
      position: fixed;
      top: 1.1rem; right: 1.1rem;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(8px);
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 2px 14px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    .music-btn:hover { transform: scale(1.12); }
    .music-btn.playing { background: rgba(247,200,160,0.85); }

    .wrap {
      position: relative;
      z-index: 10;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    /* Круг с персонажем */
    .avatar-ring {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 1.8rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 28px rgba(0,0,0,0.14);
    }

    .avatar-slide {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .avatar-slide.active { opacity: 1; }

    .avatar-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* Плейсхолдер если картинка не загрузилась */
    .avatar-slide .fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: normal;
      color: #5a4a42;
      line-height: 1.5;
      margin-bottom: 0.8rem;
    }

    .sub {
      font-size: 1rem;
      color: #a08c82;
      margin-bottom: 3rem;
      line-height: 1.7;
    }

    .phrase-card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 2.4rem 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 40px rgba(180,140,120,0.12);
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .phrase-text {
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      color: #5a4a42;
      line-height: 1.7;
      font-style: italic;
    }

    .phrase-card.fade-out { opacity: 0; transform: translateY(-8px); }
    .phrase-card.fade-in  { animation: fadeIn 0.6s ease forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 2.4rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #f5cba7, #f7b8c8);
      color: #5a3a30;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(245,180,150,0.35);
      letter-spacing: 0.3px;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(245,180,150,0.5); }
    .btn:active { transform: scale(0.97); }

    .counter {
      margin-top: 1.4rem;
      font-size: 0.85rem;
      color: #c4a898;
      letter-spacing: 1px;
    }
    .heart {
      display: inline-block;
      animation: heartbeat 2.4s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      30%       { transform: scale(1.18); }
      60%       { transform: scale(1.06); }
    }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<button class="music-btn" id="musicBtn" title="Музыка" onclick="toggleMusic()">♪</button>

<div class="wrap">

  <!-- Круг с персонажами Муми -->
  <div class="avatar-ring" id="avatarRing"></div>

  <h1>Сейчас трудно.<br>Это правда.</h1>
  <p class="sub">Нажимай, когда нужно что-то тёплое.</p>

  <div class="phrase-card fade-in" id="card">
    <p class="phrase-text" id="phrase">Ты справляешься лучше, чем тебе кажется.</p>
  </div>

  <button class="btn" id="btn" onclick="nextPhrase()">Ещё одно слово для тебя</button>

  <p class="counter"><span class="heart">♡</span> <span id="count">1</span> / 12</p>
</div>

<script>
/* ── Персонажи ── */
// Положи файлы в папку img/ с этими именами:
// moomin1.jpg … moomin9.jpg
// Фоновые цвета — как на стикерах, показываются пока нет картинки
const characters = [
  { file: 'img/moomin1.jpg', bg: '#7cc97a', emoji: '🌸' },
  { file: 'img/moomin2.jpg', bg: '#6db8d6', emoji: '🎩' },
  { file: 'img/moomin3.jpg', bg: '#f090b0', emoji: '🌺' },
  { file: 'img/moomin4.jpg', bg: '#7ab8e0', emoji: '⛏️' },
  { file: 'img/moomin5.jpg', bg: '#5aaa6a', emoji: '😤' },
  { file: 'img/moomin6.jpg', bg: '#f0d040', emoji: '🎶' },
  { file: 'img/moomin7.jpg', bg: '#e05050', emoji: '✨' },
  { file: 'img/moomin8.jpg', bg: '#e87840', emoji: '🌧️' },
  { file: 'img/moomin9.jpg', bg: '#70b8e0', emoji: '💃' },
];

const ring = document.getElementById('avatarRing');
let avatarIdx = 0;

characters.forEach((c, i) => {
  const slide = document.createElement('div');
  slide.className = 'avatar-slide' + (i === 0 ? ' active' : '');
  slide.innerHTML = `
    <div class="fallback" style="background:${c.bg}">
      <img src="${c.file}" alt="" onerror="this.parentNode.innerHTML='<div class=fallback style=background:${c.bg};width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.6rem>${c.emoji}</div>'">
    </div>`;
  ring.appendChild(slide);
});

function nextAvatar() {
  const slides = ring.querySelectorAll('.avatar-slide');
  slides[avatarIdx].classList.remove('active');
  avatarIdx = (avatarIdx + 1) % slides.length;
  slides[avatarIdx].classList.add('active');
}
setInterval(nextAvatar, 3000);

/* ── Фразы ── */
const phrases = [
  "Ты справляешься лучше, чем тебе кажется.",
  "Можно просто дышать. Этого уже достаточно.",
  "Твои чувства настоящие — и ты имеешь право их чувствовать.",
  "Ты не один, даже если сейчас так ощущается.",
  "После самой тёмной ночи всё равно приходит утро.",
  "Маленький шаг вперёд — это всё равно шаг.",
  "Тебе не нужно быть сильным прямо сейчас. Можно просто быть.",
  "Ты важен. Не за что-то — просто так.",
  "Всё это временно. А ты — нет.",
  "Разрешено отдыхать. Разрешено не знать ответов.",
  "Кто-то думает о тебе тепло прямо в эту минуту.",
  "Ты дошёл до сегодня. Это что-то значит."
];
let current = 0;

function nextPhrase() {
  const card = document.getElementById('card');
  const phraseEl = document.getElementById('phrase');
  card.classList.remove('fade-in');
  card.classList.add('fade-out');
  setTimeout(() => {
    current = (current + 1) % phrases.length;
    phraseEl.textContent = phrases[current];
    document.getElementById('count').textContent = current + 1;
    card.classList.remove('fade-out');
    void card.offsetWidth;
    card.classList.add('fade-in');
    burstConfetti();
    nextAvatar();
  }, 400);
}

/* ── Конфетти ── */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let particles = [];
const COLORS = ['#f5cba7','#f7b8c8','#c8dff7','#b8f0c8','#e8c8f7','#ffeaa7'];

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function spawnBurst(x, y) {
  for (let i = 0; i < 48; i++) particles.push({
    x, y,
    vx: (Math.random() - 0.5) * 6,
    vy: Math.random() * -5 - 1,
    size: Math.random() * 7 + 3,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.2,
    gravity: 0.13, life: 1
  });
}

function burstConfetti() { spawnBurst(canvas.width / 2, canvas.height * 0.45); }

function idleConfetti() {
  if (Math.random() < 0.1) particles.push({
    x: Math.random() * canvas.width, y: -10,
    vx: (Math.random() - 0.5) * 1,
    vy: Math.random() * 1 + 0.4,
    size: Math.random() * 5 + 2,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.07,
    gravity: 0, life: 1
  });
}

(function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  idleConfetti();
  particles = particles.filter(p => p.life > 0.01);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
    p.angle += p.spin; p.life -= 0.007;
    ctx.save();
    ctx.globalAlpha = Math.min(p.life * 2, 0.85);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    ctx.restore();
  }
  requestAnimationFrame(loop);
})();

/* ── Шарики ── */
const balloonColors = [
  ['#f7b8c8','#e8a0b0'],['#f5cba7','#e0b080'],
  ['#c8dff7','#a0c0e8'],['#d4f7c8','#a8e0a0'],['#e8c8f7','#c8a0e0'],
];

function makeBalloon() {
  const [fill, shade] = balloonColors[Math.floor(Math.random() * balloonColors.length)];
  const size = 44 + Math.random() * 28;
  const el = document.createElement('div');
  el.className = 'balloon';
  el.style.left = (8 + Math.random() * 84) + 'vw';
  const dur = 7 + Math.random() * 6;
  el.style.animationDuration = dur + 's';
  el.innerHTML = `<svg width="${size}" height="${size*1.3}" viewBox="0 0 60 80">
    <ellipse cx="30" cy="30" rx="28" ry="30" fill="${fill}"/>
    <ellipse cx="22" cy="18" rx="9" ry="7" fill="${shade}" opacity="0.35"/>
    <polygon points="27,60 33,60 30,68" fill="${fill}"/>
    <line x1="30" y1="68" x2="${28+Math.random()*4}" y2="80" stroke="${shade}" stroke-width="1.5"/>
  </svg>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), dur * 1000 + 200);
}

setTimeout(() => { for(let i=0;i<6;i++) setTimeout(makeBalloon, i*380); }, 6000);
setInterval(() => { if(Math.random()<0.5) makeBalloon(); }, 8000);

/* ── Музыка — игривая, как музыкальная шкатулка ── */
let audioCtx = null, playing = false, noteTimeout = null;

// Тема в духе Муми: весёлая, нежная, с прыжками
const tune = [
  // freq,  длительность (сек)
  [659.25, 0.18], [587.33, 0.18], [523.25, 0.18], [587.33, 0.18],
  [659.25, 0.35], [659.25, 0.35], [659.25, 0.35],
  [587.33, 0.18], [587.33, 0.18], [587.33, 0.35],
  [659.25, 0.18], [783.99, 0.18], [783.99, 0.35],
  [659.25, 0.18], [587.33, 0.18], [523.25, 0.18], [587.33, 0.18],
  [659.25, 0.35], [659.25, 0.18], [659.25, 0.18],
  [587.33, 0.18], [587.33, 0.18], [659.25, 0.18], [587.33, 0.18],
  [523.25, 0.55], [0,      0.25],
];
let tuneIdx = 0;

function playNote(freq, when, dur) {
  if (!audioCtx || !playing || freq === 0) return;
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  // Лёгкий хор: второй осциллятор чуть выше
  const osc2  = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;
  gain.gain.setValueAtTime(0, when);
  gain.gain.linearRampToValueAtTime(0.11, when + 0.04);
  gain.gain.exponentialRampToValueAtTime(0.001, when + dur * 0.9);
  gain2.gain.setValueAtTime(0, when);
  gain2.gain.linearRampToValueAtTime(0.04, when + 0.04);
  gain2.gain.exponentialRampToValueAtTime(0.001, when + dur * 0.7);
  osc.connect(gain);  gain.connect(audioCtx.destination);
  osc2.connect(gain2); gain2.connect(audioCtx.destination);
  osc.start(when);  osc.stop(when + dur);
  osc2.start(when); osc2.stop(when + dur);
}

function scheduleTune() {
  if (!playing) return;
  const [freq, dur] = tune[tuneIdx];
  playNote(freq, audioCtx.currentTime, dur);
  tuneIdx = (tuneIdx + 1) % tune.length;
  noteTimeout = setTimeout(scheduleTune, dur * 1000);
}

function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  if (!playing) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    playing = true;
    btn.textContent = '♫';
    btn.classList.add('playing');
    scheduleTune();
  } else {
    playing = false;
    clearTimeout(noteTimeout);
    btn.textContent = '♪';
    btn.classList.remove('playing');
  }
}
</script>

</body>
</html>
